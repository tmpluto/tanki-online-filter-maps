<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter Maps – Options</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --text: #1b2430;
      --muted: #6b7788;
      --dim: #8f99a7;
      --line: #dde2e8;
      --accent: #2a6f97;
      --accent-soft: #e3eff6;
      --danger: #d63a3a;
      --danger-soft: #fbeaea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --panel: #1c2229;
        --text: #e6eaef;
        --muted: #8b97a6;
        --dim: #66727f;
        --line: #2b333d;
        --accent: #6db3d8;
        --accent-soft: #22323d;
        --danger: #ff6b6b;
        --danger-soft: #3a2326;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h1 .tr { display: block; font-size: 16px; font-weight: 400; margin-top: 2px; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    p.sub .tr { display: block; }
    /* Russian translation of UI text, dimmer than the English */
    .tr { color: var(--dim); }

    .bar {
      position: sticky; top: 0; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 12px 0; background: var(--bg);
    }
    .search { display: flex; gap: 16px; flex: 1 1 200px; }
    .search input[type="search"] {
      flex: 1; min-width: 0; padding: 9px 12px; font: inherit; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    }
    /* hide the browser's hover-only clear icon; we have our own */
    .search input[type="search"]::-webkit-search-cancel-button {
      -webkit-appearance: none; appearance: none; display: none;
    }
    .clear {
      display: grid; place-items: center; flex: 0 0 auto; width: 40px; padding: 0;
      color: var(--danger); background: var(--danger-soft);
      border: 1px solid var(--danger); border-radius: 6px; cursor: pointer;
    }
    .clear:hover { color: #fff; background: var(--danger); }
    .clear svg { width: 14px; height: 14px; display: block; }
    input:focus-visible, label:focus-within {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }
    /* clear button mirrors the input's outline, in the destructive color */
    .search:focus-within .clear {
      outline: 2px solid var(--danger); outline-offset: 1px;
    }
    .status {
      width: 100%; min-height: 18px; font-size: 13px; color: var(--muted);
      display: flex; flex-wrap: wrap; column-gap: 12px;
    }

    #list {
      padding-top: 4px;
      display: grid; gap: 6px;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    }
    label.map {
      display: flex; gap: 10px; align-items: center; cursor: pointer;
      padding: 9px 12px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 6px;
    }
    label.map.on { background: var(--accent-soft); border-color: var(--accent); }
    label.map input { accent-color: var(--accent); margin: 0; }
    .ru { color: var(--muted); font-size: 13px; }
    .names { display: flex; flex-direction: column; }
    .empty {
      margin-top: 8px; padding: 36px 20px; text-align: center;
      border: 2px dashed var(--line); border-radius: 10px;
    }
    .empty strong { display: block; font-size: 22px; font-weight: 700; color: var(--text); }
    .empty .tr { display: block; margin-top: 4px; font-size: 17px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Tanki Online - Filter Maps<span class="tr">Tanki Online - Фильтр карт</span></h1>
    <p class="sub">Selected maps will be dimmed and shrunk in the battle list.
      <span class="tr">Выбранные карты будут затемнены и уменьшены в списке боёв.</span>
    </p>

    <div class="bar">
      <div class="search">
        <input id="search" type="search" placeholder="Search by English or Russian name / Поиск по английскому или русскому названию" aria-label="Search maps / Поиск карт">
        <button id="clearSearch" class="clear" type="button" hidden aria-label="Clear search / Очистить поиск" title="Clear search / Очистить поиск">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M2 2l10 10M12 2L2 12"/>
          </svg>
        </button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div id="list"></div>
    <div id="empty" class="empty" hidden>
      <strong>No maps match your search.</strong>
      <span class="tr">Нет карт, подходящих под ваш запрос.</span>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="options.js"></script>
</body>
</html>
